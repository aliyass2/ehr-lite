      HTTP_PORTS: "${AUDIT_PORT}"
      ConnectionStrings__auditdb: "Host=pg;Port=5432;Username=postgres;Password=${PG_PASSWORD};Database=auditdb"
      AUDITDB_HOST: "pg"
      AUDITDB_PORT: "5432"
      AUDITDB_USERNAME: "postgres"
      AUDITDB_PASSWORD: "${PG_PASSWORD}"
      AUDITDB_URI: "postgresql://postgres:${PG_PASSWORD}@pg:5432/auditdb"
      AUDITDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://pg:5432/auditdb"
      AUDITDB_DATABASENAME: "auditdb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "audit"
    ports:
      - "${AUDIT_PORT}"
    networks:
      - "aspire"
  timeline-bff:
    image: "${TIMELINE_BFF_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      Services__PatientRegistry__BaseUrl: "http://patient-registry:8080"
      Services__Encounters__BaseUrl: "http://encounters:8080"
      Services__ClinicalDocs__BaseUrl: "http://clinical-docs:8080"
      Services__Medications__BaseUrl: "http://medications:8080"
      Services__LabsDocs__BaseUrl: "http://labs-docs:8080"
      Services__Audit__BaseUrl: "http://audit:8080"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${TIMELINE_BFF_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "timeline-bff"
    ports:
      - "${TIMELINE_BFF_PORT}"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
